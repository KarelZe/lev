[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-undefined", "-C", "link-arg=dynamic_lookup"]

# x86-64 builds target x86-64-v2 (SSE4.2 and POPCNT, any x86-64 CPU since
# 2009): the kernels' final scores become hardware popcounts instead of a
# ~12-instruction bit trick each, and LLVM stops SLP-vectorizing the wide
# multi-word kernels through SSE.
[target.x86_64-apple-darwin]
rustflags = [
  "-C",
  "link-arg=-undefined",
  "-C",
  "link-arg=dynamic_lookup",
  "-C",
  "target-cpu=x86-64-v2",
]

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v2"]

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-cpu=x86-64-v2"]

[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-cpu=x86-64-v2"]
