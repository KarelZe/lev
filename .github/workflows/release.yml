name: release

# On every push to main, release-please opens or updates a release PR that
# bumps Cargo.toml and CHANGELOG.md from the conventional commits since the
# last release. Merging that PR tags the release and creates the GitHub
# Release; the jobs below then build the wheels and publish them to PyPI.
# Everything lives in one workflow because tags created with GITHUB_TOKEN
# do not trigger other workflows.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to rebuild and publish (e.g. 0.3.0)"
        required: true

jobs:
  release-please:
    name: Release PR
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

  version:
    name: Resolve release tag
    needs: release-please
    if: >-
      always() &&
      (needs.release-please.outputs.created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        run: echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ needs.release-please.outputs.tag || inputs.tag }}

  linux:
    name: Build — Linux (${{ matrix.libc }} ${{ matrix.target }})
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - { libc: manylinux, manylinux: auto, target: x86_64 }
          - { libc: manylinux, manylinux: auto, target: aarch64 }
          - { libc: musllinux, manylinux: musllinux_1_2, target: x86_64 }
          - { libc: musllinux, manylinux: musllinux_1_2, target: aarch64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          # Version-only specifiers (not full paths). In the cross containers
          # these resolve via sysconfig data files, which lets the aarch64
          # build read interpreter metadata without exec'ing the aarch64
          # binaries on the x86_64 host.
          args: >-
            --release --out dist
            -i python3.10 python3.11 python3.12 python3.13 python3.14 python3.14t python3.15 python3.15t
      # Guards against interpreters the build silently skipped.
      - name: Check that every Python version has a wheel
        shell: bash
        run: |
          missing=0
          for tag in cp310-cp310 cp311-cp311 cp312-cp312 cp313-cp313 \
                     cp314-cp314 cp314-cp314t cp315-cp315 cp315-cp315t; do
            if ! ls dist/*-"$tag"-*.whl >/dev/null 2>&1; then
              echo "::error::missing wheel for $tag"
              missing=1
            fi
          done
          exit "$missing"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.libc }}-${{ matrix.target }}
          path: dist/*.whl

  windows:
    name: Build — Windows (${{ matrix.target }})
    needs: version
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - runner: windows-latest
            target: x64
            architecture: x64
            python-versions: |
              3.10
              3.11
              3.12
              3.13
              3.14
              3.15
          # setup-python has no ARM64 build of 3.10, so win_arm64 starts at 3.11.
          - runner: windows-11-arm
            target: aarch64
            architecture: arm64
            python-versions: |
              3.11
              3.12
              3.13
              3.14
              3.15
          # 32-bit Python on the x64 runner.
          - runner: windows-latest
            target: x86
            architecture: x86
            python-versions: |
              3.10
              3.11
              3.12
              3.13
              3.14
              3.15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.tag }}
      # --find-interpreter keeps one interpreter per Python version, and a
      # free-threaded build installed alongside shadows the regular one. So the
      # regular versions are built first, and the free-threaded ones afterwards
      # from their explicit paths.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-versions }}
          architecture: ${{ matrix.architecture }}
          allow-prereleases: true
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
      - id: py314t
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.14t
          architecture: ${{ matrix.architecture }}
      - id: py315t
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.15t
          architecture: ${{ matrix.architecture }}
          allow-prereleases: true
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          args: >-
            --release --out dist
            -i ${{ steps.py314t.outputs.python-path }} ${{ steps.py315t.outputs.python-path }}
      # Guards against interpreters the build silently skipped. win_arm64 has
      # no cp310 wheel (see the matrix).
      - name: Check that every Python version has a wheel
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          tags="cp311-cp311 cp312-cp312 cp313-cp313 cp314-cp314 cp314-cp314t cp315-cp315 cp315-cp315t"
          if [ "$TARGET" != aarch64 ]; then tags="cp310-cp310 $tags"; fi
          missing=0
          for tag in $tags; do
            if ! ls dist/*-"$tag"-*.whl >/dev/null 2>&1; then
              echo "::error::missing wheel for $tag"
              missing=1
            fi
          done
          exit "$missing"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist/*.whl

  macos:
    name: Build — macOS (universal2)
    needs: version
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.tag }}
      # --find-interpreter keeps one interpreter per Python version, and a
      # free-threaded build installed alongside shadows the regular one. So the
      # regular versions are built first, and the free-threaded ones afterwards
      # from their explicit paths.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: |
            3.10
            3.11
            3.12
            3.13
            3.14
            3.15
          allow-prereleases: true
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: universal2-apple-darwin
          args: --release --out dist --find-interpreter
      - id: py314t
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.14t
      - id: py315t
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.15t
          allow-prereleases: true
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: universal2-apple-darwin
          args: >-
            --release --out dist
            -i ${{ steps.py314t.outputs.python-path }} ${{ steps.py315t.outputs.python-path }}
      # Guards against interpreters the build silently skipped.
      - name: Check that every Python version has a wheel
        shell: bash
        run: |
          missing=0
          for tag in cp310-cp310 cp311-cp311 cp312-cp312 cp313-cp313 \
                     cp314-cp314 cp314-cp314t cp315-cp315 cp315-cp315t; do
            if ! ls dist/*-"$tag"-*.whl >/dev/null 2>&1; then
              echo "::error::missing wheel for $tag"
              missing=1
            fi
          done
          exit "$missing"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-macos-universal2
          path: dist/*.whl

  sdist:
    name: Build — sdist
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-sdist
          path: dist/*.tar.gz

  publish-test-pypi:
    name: Publish — Test PyPI
    needs: [linux, windows, macos, sdist]
    runs-on: ubuntu-latest
    environment: test-pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # Re-runs of a release must not fail on files that are already up.
          skip-existing: true

  # Gated on Test PyPI so a rejected upload never reaches the real index.
  publish-pypi:
    name: Publish — PyPI
    needs: publish-test-pypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

  github-release:
    name: Attach wheels to GitHub Release
    needs: [version, linux, windows, macos, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
