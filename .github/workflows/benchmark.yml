name: Benchmark

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!docs/**'
  pull_request:
    paths:
      - '**'
      - '!docs/**'

jobs:
  benchmarks:
    name: CodSpeed benchmarks (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: llvm-tools

      - name: Install maturin
        run: pip install maturin

      - name: Disable strip for this ephemeral CI build
        # strip=true (the shipped default) silently discards the LLVM profiling
        # runtime's ability to flush .profraw when this cdylib is dlopen'd by
        # CPython -- the instrumented step below would train on zero samples
        # without this. Only ever applied to this job's throwaway checkout;
        # never affects the published wheel (release.yml keeps strip=true).
        run: sed -i 's/^strip = true$/strip = false/' pyproject.toml

      - name: Build instrumented (PGO training) wheel
        run: RUSTFLAGS="-Cprofile-generate=${{ github.workspace }}/pgo-data" maturin build --release --out dist-pgo-instrumented

      - name: Install instrumented wheel
        run: pip install --force-reinstall --no-deps dist-pgo-instrumented/*.whl

      - name: Train PGO profile
        run: python scripts/pgo_train.py

      - name: Merge PGO profile
        run: |
          host="$(rustc -vV | sed -n 's/^host: //p')"
          llvm_profdata="$(rustc --print sysroot)/lib/rustlib/${host}/bin/llvm-profdata"
          "$llvm_profdata" merge -o "${{ github.workspace }}/merged.profdata" "${{ github.workspace }}"/pgo-data/*.profraw

      - name: Build optimized (PGO) wheel and install
        run: |
          RUSTFLAGS="-Cprofile-use=${{ github.workspace }}/merged.profdata -Cllvm-args=-pgo-warn-missing-function" maturin build --release --out dist-pgo-optimized
          pip install --force-reinstall --no-deps dist-pgo-optimized/*.whl

      - name: Install benchmark deps
        run: pip install pytest pytest-codspeed pytest-cov

      - uses: CodSpeedHQ/action@4296e51e7041e24dadb86d1d6e8b9320d223dbe8 # v5.0.3
        with:
          mode: simulation
          token: ${{ secrets.CODSPEED_TOKEN }}
          run: pytest tests/test_lev.py --codspeed --no-cov
