name: Benchmark

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!docs/**'
  pull_request:
    paths:
      - '**'
      - '!docs/**'

jobs:
  benchmarks:
    name: CodSpeed benchmarks (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: llvm-tools

      - name: Install maturin
        run: pip install maturin

      - name: Build instrumented (PGO training) wheel
        # --strip=false overrides pyproject.toml's strip=true for this build only:
        # stripping silently discards the LLVM profiling runtime's ability to
        # flush .profraw when this cdylib is dlopen'd by CPython, so the
        # training step below would collect zero samples without it. The
        # optimized build two steps down doesn't need to flush anything, so
        # it keeps the real (stripped) default -- matching what release.yml ships.
        run: RUSTFLAGS="-Cprofile-generate=${{ github.workspace }}/pgo-data" maturin build --release --strip=false --out dist-pgo-instrumented

      - name: Install instrumented wheel
        run: pip install --force-reinstall --no-deps dist-pgo-instrumented/*.whl

      - name: Train PGO profile
        # LLVM_PROFILE_FILE routes the training profile into its own
        # subdirectory. Everything written directly into pgo-data/ came from
        # build scripts and proc macros (syn, quote, pyo3-macros) executing
        # during the compile above -- ~1.9 MB of compiler-run counters that
        # would otherwise be merged in alongside ~100 KB of actual signal.
        # pgo_train.py aborts if the installed extension isn't instrumented.
        run: |
          mkdir -p "${{ github.workspace }}/pgo-data/train"
          LLVM_PROFILE_FILE="${{ github.workspace }}/pgo-data/train/lev-%p.profraw" python scripts/pgo_train.py

      - name: Merge PGO profile
        run: |
          host="$(rustc -vV | sed -n 's/^host: //p')"
          llvm_profdata="$(rustc --print sysroot)/lib/rustlib/${host}/bin/llvm-profdata"
          shopt -s nullglob
          profraw=("${{ github.workspace }}"/pgo-data/train/*.profraw)
          if [ ${#profraw[@]} -eq 0 ]; then
            echo "::error::Training run produced no .profraw files; the profile would be empty."
            exit 1
          fi
          "$llvm_profdata" merge -o "${{ github.workspace }}/merged.profdata" "${profraw[@]}"

      - name: Verify PGO profile covers the lev kernel
        # Without this, a training run that collected zero samples still
        # produces a valid-but-useless .profdata, -Cprofile-use still
        # succeeds, and the "PGO" wheel below is silently just a release
        # build. Fail loudly instead.
        run: |
          host="$(rustc -vV | sed -n 's/^host: //p')"
          llvm_profdata="$(rustc --print sysroot)/lib/rustlib/${host}/bin/llvm-profdata"
          count="$("$llvm_profdata" show --all-functions "${{ github.workspace }}/merged.profdata" | grep -c '_ZN3lev' || true)"
          echo "lev symbols in merged profile: ${count}"
          if [ "$count" -eq 0 ]; then
            echo "::error::Merged profile contains no lev symbols; training collected nothing."
            exit 1
          fi

      - name: Build optimized (PGO) wheel and install
        run: |
          RUSTFLAGS="-Cprofile-use=${{ github.workspace }}/merged.profdata -Cllvm-args=-pgo-warn-missing-function" maturin build --release --out dist-pgo-optimized
          pip install --force-reinstall --no-deps dist-pgo-optimized/*.whl

      - name: Install benchmark deps
        run: pip install pytest pytest-codspeed pytest-cov

      - uses: CodSpeedHQ/action@4296e51e7041e24dadb86d1d6e8b9320d223dbe8 # v5.0.3
        with:
          mode: simulation
          token: ${{ secrets.CODSPEED_TOKEN }}
          run: pytest tests/test_lev.py --codspeed --no-cov
