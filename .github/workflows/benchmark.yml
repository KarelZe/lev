name: Benchmark

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!docs/**'
  pull_request:
    paths:
      - '**'
      - '!docs/**'

jobs:
  benchmarks:
    name: CodSpeed benchmarks (${{ matrix.arch }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86-64, runner: ubuntu-latest, python-version: "3.13" }
          - { arch: x86-64, runner: ubuntu-latest, python-version: "3.14" }
          - { arch: x86-64, runner: ubuntu-latest, python-version: "3.15" }
          # AArch64 kernels (src/kernels/aarch64) never run on x86-64. Its
          # benchmark names carry a prefix, since CodSpeed rejects a name
          # reported by two jobs.
          - { arch: aarch64, runner: ubuntu-24.04-arm, python-version: "3.13", prefix: aarch64- }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Unlike the other workflows this job stays on setup-python + pip:
      # CodSpeed counts instructions executed inside CPython, so the
      # interpreter build has to stay fixed for results to stay comparable.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Build extension and install benchmark deps
        run: pip install --group test .

      - uses: CodSpeedHQ/action@78102a468f96d8e0ccb92d0ec49425753fc42062 # v5.6.0
        with:
          mode: simulation
          token: ${{ secrets.CODSPEED_TOKEN }}
          run: pytest tests/test_bench.py --codspeed
        env:
          LEV_BENCH_PREFIX: ${{ matrix.prefix }}
