name: Wheels

# Builds the wheels for the platforms the regular test suite does not cover
# (musllinux and Windows ARM64) the same way release.yml does, installs them
# and runs the test suite against the installed wheel.
on:
  pull_request:
    paths:
      - ".cargo/**"
      - ".github/workflows/release.yml"
      - ".github/workflows/wheels.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "build.rs"
      - "pyproject.toml"
      - "python/**"
      - "src/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  musllinux-build:
    name: Build musllinux (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.target }}
          manylinux: musllinux_1_2
          # One regular and one free-threaded interpreter keep this cheap;
          # release.yml builds the full list.
          args: --release --out dist -i python3.13 python3.14t
      - run: ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: musllinux-${{ matrix.target }}
          path: dist/*.whl

  # Runs in Alpine through `docker run`: JavaScript actions do not work inside
  # an Alpine job container on ARM64 runners.
  musllinux-test:
    name: Test musllinux (${{ matrix.target }}, Python ${{ matrix.python }})
    needs: musllinux-build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64, runner: ubuntu-latest, python: "3.13" }
          - { target: aarch64, runner: ubuntu-24.04-arm, python: "3.13" }
          - { target: x86_64, runner: ubuntu-latest, python: "3.14t" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: musllinux-${{ matrix.target }}
          path: dist
      - name: Install the wheel and run the tests in Alpine
        env:
          PY: ${{ matrix.python }}
        run: |
          docker run --rm -v "$PWD:/io" -w /io -e PY python:3.13-alpine sh -euxc '
            pip install -q --root-user-action=ignore uv
            uv venv -q --python "$PY" /venv
            uv pip install -q --python /venv --no-index --find-links dist lev-rs
            uv pip install -q --python /venv pytest pytest-codspeed rapidfuzz
            /venv/bin/python -c "import lev, sys, sysconfig; print(sys.version, sysconfig.get_platform(), lev.__file__)"
            /venv/bin/python -m pytest tests/
          '

  windows-arm64:
    name: Build and test Windows ARM64 (Python ${{ matrix.python }})
    runs-on: windows-11-arm
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14t"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: py
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: aarch64
          args: --release --out dist -i ${{ steps.py.outputs.python-path }}
      - name: Install the wheel and run the tests
        env:
          PY: ${{ steps.py.outputs.python-path }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Get-ChildItem dist
          & $env:PY -m pip install --no-index --find-links dist lev-rs
          & $env:PY -m pip install pytest pytest-codspeed rapidfuzz
          & $env:PY -c "import lev, sys, sysconfig; print(sys.version, sysconfig.get_platform(), lev.__file__)"
          & $env:PY -m pytest tests/
