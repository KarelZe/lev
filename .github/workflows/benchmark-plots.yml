name: Benchmark plots

# Generates the README/docs benchmark figures (docs/assets/benchmark_*.svg) on
# GitHub-hosted runners, so they are reproducible and free of local noise.
# The linux-x86-64 figures are committed back to the repository automatically.
# Per-PR performance is checked by ab-benchmark.yml, not here.
on:
  pull_request:
    paths:
      - 'scripts/benchmark.py'
      - '.github/workflows/benchmark-plots.yml'
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit updated plots to repository'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: benchmark-plots-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plots:
    name: Plots (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Published figures: Linux x86-64 is where almost all PyPI downloads run.
          - { name: linux-x86-64, os: ubuntu-24.04 }
          # Reference only: Apple Silicon, like the figures before this workflow.
          - { name: macos-arm64, os: macos-15 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          python-version: "3.13"

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      # Builds lev from this checkout (maturin, release profile) and installs the
      # competitors into the script environment, outside the timed step.
      - name: Build lev and benchmark dependencies
        run: uv sync -v --script scripts/benchmark.py

      - name: Hardware
        run: |
          { echo '```'; if [ "$RUNNER_OS" = Linux ]; then lscpu; else sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize; fi; echo '```'; } \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run benchmark
        run: |
          # Pin to one core on Linux so the scheduler does not migrate the timed process.
          pin=$([ "$RUNNER_OS" = Linux ] && echo "taskset -c 1" || true)
          $pin uv run scripts/benchmark.py --repetitions 1000 --best-of 25 | tee benchmark.txt
          { echo '```'; cat benchmark.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-plots-${{ matrix.name }}
          path: |
            docs/assets/benchmark_*.svg
            docs/assets/benchmark_results.json

  commit:
    name: Commit plots to repository
    needs: plots
    if: >-
      always() &&
      needs.plots.result == 'success' &&
      ((github.event_name == 'workflow_dispatch' && (inputs.commit == true || inputs.commit == 'true')) ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 1

      - name: Download linux-x86-64 benchmark plots
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: benchmark-plots-linux-x86-64
          path: /tmp/benchmark-plots

      - name: Update plots and commit changes
        shell: bash
        run: |
          if [ -d /tmp/benchmark-plots/docs/assets ]; then
            cp /tmp/benchmark-plots/docs/assets/benchmark_*.svg docs/assets/
          else
            cp /tmp/benchmark-plots/benchmark_*.svg docs/assets/
          fi

          # Trim trailing whitespace so prek / pre-commit hooks pass cleanly
          python3 -c '
          from pathlib import Path
          for p in Path("docs/assets").glob("benchmark_*.svg"):
              text = p.read_text(encoding="utf-8")
              cleaned = "\n".join(line.rstrip() for line in text.splitlines()) + "\n"
              p.write_text(cleaned, encoding="utf-8")
          '

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/benchmark_*.svg

          if git diff --staged --quiet; then
            echo "No changes in benchmark plots to commit."
          else
            git commit -m "chore: update benchmark plots in documentation 🔧"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi
