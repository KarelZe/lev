# Latency probe for the Apple `myers_step` blocks (AArch64 only), kept out of
# the lev-rs crate. Run from this directory:
#   cargo run --release            # cycles per column of every block in src/blocks.rs
#   cargo run --release -- --ops   # also the latency of single instructions
#   cargo run --release --bin chain  # chain alone vs. chain with fan-out
[package]
name = "latprobe"
version = "0.1.0"
edition = "2021"
publish = false

[profile.release]
opt-level = 3
